workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

stages:
  - test
  - lint
  - build
  - publish
  - release
  - deploy

include:
  - component: $CI_SERVER_FQDN/patrick.pfenning.92/ci-templates/pre-commit@0.6.0
  - component: $CI_SERVER_FQDN/patrick.pfenning.92/ci-templates/security@0.6.0
  - component: $CI_SERVER_FQDN/patrick.pfenning.92/ci-templates/container-build@0.8.0
  - component: $CI_SERVER_FQDN/patrick.pfenning.92/ci-templates/container-tag@feat/container-tag-cross-registry
  - component: $CI_SERVER_FQDN/patrick.pfenning.92/ci-templates/container-tag@feat/container-tag-cross-registry
    inputs:
      prefix: "ghcr:"
      stage: publish
      to_image: ghcr.io/chromagoth/palettes
      dest_registry: ghcr.io
      dest_username: chromagoth-operator
      dest_password: $GH_TOKEN_CLASSIC
      needs_latest: [container:tag:latest]
      needs_gittag: [container:tag:gittag]
  - component: $CI_SERVER_FQDN/patrick.pfenning.92/ci-templates/container-tag@feat/container-tag-cross-registry
    inputs:
      prefix: "dockerhub:"
      stage: publish
      to_image: docker.io/chromagoth/palettes
      dest_registry: docker.io
      dest_username: $DOCKERHUB_USERNAME
      dest_password: $DOCKERHUB_TOKEN
      needs_latest: [container:tag:latest]
      needs_gittag: [container:tag:gittag]
  - component: $CI_SERVER_FQDN/patrick.pfenning.92/ci-templates/container-tag@feat/container-tag-cross-registry
    inputs:
      prefix: "quay:"
      stage: publish
      to_image: quay.io/chromagoth/palettes
      dest_registry: quay.io
      dest_username: $QUAY_USERNAME
      dest_password: $QUAY_TOKEN
      needs_latest: [container:tag:latest]
      needs_gittag: [container:tag:gittag]

test:
  stage: test
  image: golang:1.23-alpine
  script:
    - go test ./...
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

build:binary:
  stage: build
  image: golang:1.23-alpine
  script:
    - CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o dist/chromagoth ./cmd/chromagoth
  artifacts:
    paths:
      - dist/chromagoth
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success


container:build:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

.goreleaser:
  stage: release
  image:
    name: goreleaser/goreleaser:v2.15.4
    entrypoint: [""]
  needs:
    - job: test
      optional: true
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
    GIT_DEPTH: 0

release:nightly:
  extends: .goreleaser
  script:
    - goreleaser release --snapshot --clean
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:dev:
  extends: .goreleaser
  script:
    - goreleaser release --snapshot --clean
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: manual

release:goreleaser:
  extends: .goreleaser
  script:
    - goreleaser release --clean
  rules:
    - if: $CI_COMMIT_TAG

release:github:
  stage: release
  image: alpine:3.21
  needs:
    - job: release:goreleaser
      artifacts: true
  variables:
    GH_TOKEN: $GH_TOKEN
  before_script:
    - apk add --no-cache github-cli
  script:
    - gh release create "$CI_COMMIT_TAG"
        dist/chromagoth_*.tar.gz
        dist/checksums.txt
        --repo chromagoth/palettes
        --title "$CI_COMMIT_TAG"
        --generate-notes
  rules:
    - if: $CI_COMMIT_TAG

pages:
  stage: deploy
  image: golang:1.23-alpine
  script:
    - go run ./cmd/chromagoth preview build
  artifacts:
    paths:
      - public/
  environment: development
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
